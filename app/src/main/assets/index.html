<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d12"><title>SQ Motion Studio</title><style>
:root{--bg:#0b0d12;--p:#151923;--p2:#202536;--line:#303748;--txt:#f4f5fb;--mut:#929bb0;--a:#8b5cf6;--c:#25d6d6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px system-ui}button,input,select{font:inherit}button{border:1px solid var(--line);background:var(--p2);color:var(--txt);padding:9px 11px;border-radius:9px;cursor:pointer}button.primary{background:var(--a);border-color:var(--a)}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--line)}.brand{font-weight:900}.brand b{color:var(--a)}.layout{display:grid;grid-template-columns:66px minmax(250px,1fr) 290px;min-height:calc(100vh - 58px)}nav{padding:10px 6px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:7px}nav button{font-size:11px;padding:10px 2px}main{padding:14px;min-width:0}.side{padding:13px;border-right:1px solid var(--line);background:#10131a}.title{display:flex;justify-content:space-between;font-weight:800;margin-bottom:12px}.stagebox{background:#06070a;border:1px solid var(--line);padding:10px;border-radius:14px;display:flex;justify-content:center}.stage{width:min(100%,700px);aspect-ratio:16/9;background:#161a2a}.stage canvas{width:100%;height:100%}.transport{display:flex;justify-content:center;align-items:center;gap:8px;padding:12px}.time{color:var(--c);font-variant-numeric:tabular-nums}.timeline,.panel{border:1px solid var(--line);border-radius:12px;background:var(--p);padding:11px;margin-top:10px}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.tracks{margin-top:10px}.track{display:flex;gap:8px;align-items:center;margin:7px 0}.trackname{width:65px;color:var(--mut);font-size:11px}.lane{height:32px;background:#0b0e15;border:1px solid var(--line);border-radius:6px;flex:1;position:relative;overflow:hidden}.clip{position:absolute;top:3px;bottom:3px;border-radius:5px;background:linear-gradient(90deg,#8b5cf6,#25b9d7);font-size:10px;padding:5px;color:white;overflow:hidden;white-space:nowrap}.muted{color:var(--mut)}.small{font-size:11px}.field{margin:12px 0;display:grid;gap:6px}.field label{font-size:12px;color:var(--mut)}input[type=text],input[type=number],select{background:#0c0f16;color:white;border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}input[type=range]{width:100%;accent-color:var(--a)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.effect{text-align:right;padding:8px}.thumb{height:60px;border-radius:7px;background:radial-gradient(circle at 35% 30%,#a78bfa,#252342 55%,#0c0e16);display:grid;place-items:center;font-size:25px;margin-bottom:6px}.hidden{display:none}.project{border:1px solid var(--line);padding:9px;border-radius:8px;margin:7px 0}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#252b3a;padding:12px;border-radius:10px}.badge{font-size:10px;background:#29223f;color:#d2c4ff;padding:4px;border-radius:5px}@media(max-width:850px){.layout{grid-template-columns:54px minmax(0,1fr)}.side{grid-column:2;border-right:0;border-top:1px solid var(--line)}main{padding:8px}nav{grid-row:1/span 2}.top{padding:8px}.top button{padding:7px;font-size:11px}}
</style></head><body><header class="top"><div class="brand"><b>◈</b> SQ MOTION <span class="muted">STUDIO</span></div><div class="row"><button id="new">＋ جديد</button><button id="save">حفظ</button><button class="primary" id="export">تصدير ↗</button></div></header><div class="layout"><nav><button data-page="editor">▣<br>المحرر</button><button data-page="effects">✧<br>التأثيرات</button><button data-page="projects">▤<br>المشاريع</button><button data-page="templates">▦<br>القوالب</button><button data-page="layers">▱<br>الطبقات</button><button data-page="settings">⚙<br>الإعدادات</button></nav><main><div class="title"><span id="pageTitle">المحرر</span><span class="badge" id="projectName">مشروعي</span></div><div class="stagebox"><div class="stage"><canvas id="canvas" width="1280" height="720"></canvas></div></div><div class="transport"><button id="start">|◀</button><button class="primary" id="play">▶</button><button id="stop">■</button><span class="time" id="time">00:00.00</span></div><section class="timeline"><div class="title">الخط الزمني <div class="row"><button id="addText">＋ نص</button><button id="addMedia">＋ وسائط</button><button id="addKey">◆ مفتاح</button></div></div><div class="tracks" id="tracks"></div><input id="scrub" type="range" min="0" max="10" step=".01" value="0"></section><section class="panel"><div class="title">المشروع <span class="muted small">1280×720 • 30 FPS</span></div><div class="row"><button id="ratio">نسبة الأبعاد</button><button id="duration">المدة: 10 ث</button><button id="undo">↶ تراجع</button><button id="redo">↷ إعادة</button></div></section></main><aside class="side"><div class="title">خصائص العنصر <span class="muted small">INSPECTOR</span></div><div id="inspector"></div></aside></div><input id="media" type="file" accept="image/*,video/*" multiple class="hidden"><input id="projectFile" type="file" accept=".json" class="hidden"><div id="toast" class="toast hidden"></div><script src="app.js"></script></body></html>
